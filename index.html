<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteka EPUB</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Biblioteka EPUB</h1>
      <p class="subtitle">Czytanie książek online z repozytorium</p>
    </div>
    <nav class="topbar-actions">
      <a class="btn secondary" href="admin.html">Panel administratora</a>
    </nav>
  </header>

  <main class="reader-layout">
    <aside class="sidebar">
      <section class="panel">
        <div class="section-head">
          <h2>Biblioteka</h2>
          <button id="refreshLibraryBtn" class="btn">Odśwież</button>
        </div>
        <div id="booksList" class="books-list"></div>
      </section>
    </aside>

    <section class="content">
      <section class="panel">
        <div id="bookInfo" class="book-info empty">
          Wybierz książkę z listy po lewej stronie.
        </div>

        <div id="readerControls" class="reader-controls hidden">
          <button id="prevPageBtn" class="btn secondary">Poprzednia</button>
          <button id="nextPageBtn" class="btn secondary">Następna</button>
          <button id="decreaseFontBtn" class="btn secondary">A-</button>
          <button id="increaseFontBtn" class="btn secondary">A+</button>
        </div>

        <div id="viewer" class="viewer"></div>
      </section>
    </section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
