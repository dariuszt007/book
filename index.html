<div class="drawer-section hidden" id="readerSettingsPanel">
  <div class="settings-inline-row">
    <div class="settings-inline-field">
      <label class="settings-inline-label" for="fontFamilySelect">Czcionka</label>
      <select id="fontFamilySelect" class="settings-inline-select">
        <option value="arial">Arial</option>
        <option value="times">Times New Roman</option>
        <option value="serif">Serif</option>
        <option value="sans">Sans-Serif</option>
        <option value="klee">クレー・ワン</option>
        <option value="shippori">しっぽり明朝</option>
        <option value="bizud">BIZ UDゴシック</option>
        <option value="notoserifjp">源ノ明朝</option>
      </select>
    </div>

    <div class="settings-inline-field">
      <label class="settings-inline-label" for="pageTransitionSelect">Przejście</label>
      <select id="pageTransitionSelect" class="settings-inline-select">
        <option value="none">Standard</option>
        <option value="slide">Slide</option>
        <option value="fade">Fade</option>
        <option value="book">Book</option>
      </select>
    </div>
  </div>

  <h4>Motywy i ustawienia</h4>

  <div class="drawer-settings-controls">
    <div class="segmented-group">
      <button class="seg-btn seg-btn-large" id="fontMinusBtn" type="button">A</button>
      <button class="seg-btn seg-btn-large" id="fontPlusBtn" type="button">A</button>
    </div>

    <div class="segmented-group">
      <button class="seg-btn" id="spreadOneBtn" type="button">1 str.</button>
      <button class="seg-btn" id="spreadTwoBtn" type="button">2 str.</button>
    </div>
  </div>

  <div class="drawer-theme-grid">
    <button class="theme-tile" data-theme="day" type="button">
      <span class="theme-aa">Aa</span>
      <span>Dzień</span>
    </button>
    <button class="theme-tile" data-theme="night" type="button">
      <span class="theme-aa">Aa</span>
      <span>Noc</span>
    </button>
    <button class="theme-tile" data-theme="sepia" type="button">
      <span class="theme-aa">Aa</span>
      <span>Sepia</span>
    </button>
    <button class="theme-tile" data-theme="console" type="button">
      <span class="theme-aa">Aa</span>
      <span>Console</span>
    </button>
  </div>
</div>
